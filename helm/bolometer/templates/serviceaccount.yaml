{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bolometer.serviceAccountName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bolometer.labels" . | nindent 4 }}
  {{- with (include "bolometer.serviceAccountAnnotations" . | trim) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
