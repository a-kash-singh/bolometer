apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bolometer.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bolometer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "bolometer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bolometer.selectorLabels" . | nindent 8 }}
        # "app: bolometer" kept for backwards-compat with scripts that use -l app=bolometer
        app: {{ include "bolometer.name" . }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "bolometer.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: manager
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - /manager
        args:
        {{- if .Values.leaderElection.enabled }}
        - --leader-elect
        {{- end }}
        env:
        # AWS region — always injected so the AWS SDK picks up the right region
        - name: AWS_REGION
          value: {{ .Values.aws.region | quote }}
        {{- if .Values.aws.staticCredentials.enabled }}
        # Static credentials for MinIO / non-IRSA setups
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "bolometer.awsSecretName" . }}
              key: {{ .Values.aws.staticCredentials.existingSecretKeyId | default "AWS_ACCESS_KEY_ID" | quote }}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "bolometer.awsSecretName" . }}
              key: {{ .Values.aws.staticCredentials.existingSecretKeySecret | default "AWS_SECRET_ACCESS_KEY" | quote }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.metrics.port }}
          name: metrics
          protocol: TCP
        - containerPort: {{ .Values.healthProbe.port }}
          name: health
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
