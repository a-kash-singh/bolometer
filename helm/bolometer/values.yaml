# Default values for bolometer

# Operator image configuration
image:
  repository: bolometer
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []

# Operator deployment configuration
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

# ── Service Account ───────────────────────────────────────────────────────────
serviceAccount:
  create: true
  # Extra annotations (merged with aws.irsa.roleArn if IRSA is enabled)
  annotations: {}
  name: "bolometer"

# ── AWS Credentials ───────────────────────────────────────────────────────────
aws:
  # Default AWS region (injected as AWS_REGION env var)
  region: "us-east-1"

  # IRSA — IAM Roles for Service Accounts (recommended for EKS)
  # Set irsa.enabled=true and irsa.roleArn to have the chart automatically
  # add the eks.amazonaws.com/role-arn annotation to the ServiceAccount.
  # See aws/irsa-setup.sh for the required IAM policy and trust relationship.
  irsa:
    enabled: false
    roleArn: ""   # arn:aws:iam::ACCOUNT_ID:role/bolometer-role

  # Static credentials — for MinIO or non-EKS environments.
  # Creates a Secret and injects AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY env vars.
  # Use existingSecret to reference a pre-created Secret instead.
  staticCredentials:
    enabled: false
    accessKeyId: ""
    secretAccessKey: ""
    existingSecret: ""                          # name of a pre-created Secret
    existingSecretKeyId: "AWS_ACCESS_KEY_ID"    # key inside existingSecret
    existingSecretKeySecret: "AWS_SECRET_ACCESS_KEY"

# ── RBAC ──────────────────────────────────────────────────────────────────────
rbac:
  create: true

# ── Resources ─────────────────────────────────────────────────────────────────
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# ── Security ──────────────────────────────────────────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  runAsNonRoot: true
  runAsUser: 65532

# ── Operator Features ─────────────────────────────────────────────────────────
leaderElection:
  enabled: true

metrics:
  enabled: true
  port: 8080

healthProbe:
  port: 8081

# ── Namespace & CRD ───────────────────────────────────────────────────────────
namespace: bolometer-system

crd:
  install: true

# ── ProfilingConfig (optional) ────────────────────────────────────────────────
# Set create: true to deploy a ProfilingConfig CR alongside the operator.
# Useful for GitOps / single-chart deployments.
profilingConfig:
  create: false
  name: "default"
  namespace: "default"    # target namespace (where your app lives)

  selector:
    namespace: "default"
    labelSelector: {}     # e.g. { app: my-go-app }

  thresholds:
    cpuThresholdPercent: 80
    memoryThresholdPercent: 90
    checkIntervalSeconds: 30
    cooldownSeconds: 300

  onDemand:
    enabled: false
    intervalSeconds: 35

  s3:
    bucket: ""            # required when profilingConfig.create=true
    region: "us-east-1"
    prefix: "profiles"
    endpoint: ""          # leave empty for AWS S3; set for MinIO / custom

  profileTypes:
    - heap
    - cpu
    - goroutine
    - mutex
